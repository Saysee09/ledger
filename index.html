<link rel="icon" id="favIcon">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#F6F7FB;--card:#FFFFFF;--ink:#0F1222;--mute:#687086;--faint:#A6ABBA;--line:#E9EBF2;--soft:#F2F4F8;--acc:#5B5BF7;--acc2:#EEEEFF;--green:#11A04F;--red:#E5484D;--amber:#D98200;--blue:#2F7BF5;--sh:0 1px 2px rgba(15,18,34,.04),0 6px 20px rgba(15,18,34,.05);color-scheme:light}
[data-theme=dark]{--bg:#0B0D14;--card:#151824;--ink:#ECEEF6;--mute:#8E94AA;--faint:#585E72;--line:#242838;--soft:#1C2030;--acc:#8183FF;--acc2:#23255A;--green:#3DD68C;--red:#FF6B6E;--amber:#FFB224;--blue:#5EA2FF;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* GLASS: frosted panels over a soft colour wash. Light or dark follows the phone (or your pick) */
[data-glass]{--card:rgba(255,255,255,.56);--soft:rgba(255,255,255,.46);--line:rgba(255,255,255,.72);--bg:#EDEFFB;--sh:inset 0 1px 0 rgba(255,255,255,.8),0 10px 30px rgba(43,36,130,.12);--glass-wash:radial-gradient(42% 32% at 12% 6%,rgba(139,108,255,.55),transparent 70%),radial-gradient(46% 34% at 95% 22%,rgba(34,211,238,.42),transparent 70%),radial-gradient(52% 40% at 78% 88%,rgba(244,114,182,.38),transparent 70%),radial-gradient(46% 38% at 6% 72%,rgba(251,191,36,.32),transparent 70%)}
[data-glass][data-theme=dark]{--card:rgba(30,32,58,.46);--soft:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--bg:#090A17;--sh:inset 0 1px 0 rgba(255,255,255,.07),0 12px 32px rgba(0,0,0,.45);--glass-wash:radial-gradient(42% 32% at 12% 6%,rgba(111,76,255,.5),transparent 70%),radial-gradient(46% 34% at 95% 22%,rgba(14,165,233,.32),transparent 70%),radial-gradient(52% 40% at 78% 88%,rgba(219,39,119,.3),transparent 70%),radial-gradient(46% 38% at 6% 72%,rgba(245,158,11,.18),transparent 70%)}
/* the colour wash is its own fixed layer (GPU-friendly), not a fixed page background that repaints on every scroll */
html[data-glass]{background:var(--bg)}
html[data-glass]::before{content:'';position:fixed;inset:-2px;z-index:-1;pointer-events:none;background:var(--glass-wash),var(--bg);transform:translateZ(0)}
[data-glass] body{background:transparent}
/* SMOOTH (default, data-glass=1): cards are tinted see-through with no live blur, so scrolling stays fast on any phone */
[data-glass="1"]{--card:rgba(255,255,255,.7);--sh:inset 0 1px 0 rgba(255,255,255,.85),0 4px 14px rgba(43,36,130,.09)}
[data-glass="1"][data-theme=dark]{--card:rgba(30,32,58,.66);--sh:inset 0 1px 0 rgba(255,255,255,.06),0 6px 16px rgba(0,0,0,.35)}
/* FULL BLUR (data-glass=full): real frosted glass on every card, for fast phones */
[data-glass=full] .card,[data-glass=full] #view .group,[data-glass=full] .hero,[data-glass=full] .alert{backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%)}
[data-glass] .chip,[data-glass] .iconbtn,[data-glass] .sync{background:color-mix(in srgb,var(--card) 80%,transparent)}
[data-glass] .chip.on,[data-glass] .sheet .chip.on{background:var(--ink);color:var(--bg)}
[data-glass] .strip .acard{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 6px rgba(20,16,80,.06)}
[data-glass="1"] header.top{background:color-mix(in srgb,var(--bg) 74%,transparent);margin:0 -16px;padding-left:18px;padding-right:18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
[data-glass=full] header.top{background:linear-gradient(color-mix(in srgb,var(--bg) 86%,transparent) 62%,transparent);margin:0 -16px;padding-left:18px;padding-right:18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
[data-glass] .sheet{background:rgba(250,250,255,.8);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-top:1px solid rgba(255,255,255,.9)}
[data-glass="1"] .sheet{background:rgba(250,250,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
[data-glass][data-theme=dark] .sheet{background:rgba(22,24,44,.82);border-top-color:rgba(255,255,255,.14)}
[data-glass="1"][data-theme=dark] .sheet{background:rgba(22,24,44,.92)}
[data-glass] .sheet input,[data-glass] .sheet select{background:rgba(120,124,160,.12)}
[data-glass] .hero{background:radial-gradient(140% 130% at 100% 0%,color-mix(in srgb,var(--hc) 26%,transparent) 0%,color-mix(in srgb,var(--hc) 8%,transparent) 50%,transparent 85%),var(--card)}
[data-glass] .scrim{background:rgba(6,8,20,.32)}
@media (prefers-reduced-transparency:reduce){[data-glass]{--card:rgba(255,255,255,.92)}[data-glass][data-theme=dark]{--card:rgba(30,32,58,.94)}}
.sugbox{background:color-mix(in srgb,var(--acc) 9%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 28%,transparent);border-radius:16px;padding:10px 12px;margin:2px 0 12px}
.sugbox .sg-h{font-size:.78rem;font-weight:800;color:var(--acc)}.sugbox .sg-l{font-size:.8rem;margin-top:3px;overflow-wrap:anywhere}.sugbox .sg-l small{color:var(--mute)}
.sugbox .chip small{color:inherit;opacity:.7;font-weight:600}
.sugbox .chip{max-width:100%;white-space:normal;text-align:left;line-height:1.25;padding-top:6px;padding-bottom:6px}
.recall{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;width:100%;text-align:left;margin-top:8px;padding:9px 12px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--acc) 45%,transparent);background:color-mix(in srgb,var(--acc) 7%,transparent);font-size:.8rem}
.recall span{font-weight:800;color:var(--acc)}.recall b{font-weight:700;min-width:0;overflow-wrap:anywhere}.recall small{flex-basis:100%;color:var(--mute)}
.recall.on{border-style:solid}
.item small.wrap{white-space:normal;overflow:visible;text-overflow:clip}
html.wr-on,html.wr-on body{overflow:hidden}
#wrap{position:fixed;inset:0;z-index:95;background:#0B0A1F;display:flex;flex-direction:column;color:#fff;animation:fade .25s ease}
.wr-top{position:absolute;left:0;right:0;top:0;z-index:2;padding:calc(10px + env(safe-area-inset-top)) 14px 0;pointer-events:none}
.wr-prog{display:flex;gap:4px}.wr-prog i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}.wr-prog i.on{background:#fff}
.wr-bar{display:flex;align-items:center;gap:6px;margin-top:8px;pointer-events:auto}.wr-bar b{flex:1;text-align:center;font-size:.9rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr-bar button{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;font-size:1.2rem;font-weight:800;flex:0 0 auto}.wr-bar button:disabled{opacity:.3}
.wr-track{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain}.wr-track::-webkit-scrollbar{display:none}
.wr-s{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;background:linear-gradient(160deg,var(--a),var(--b));padding:calc(96px + env(safe-area-inset-top)) 24px 24px;overflow-y:auto;overflow-x:hidden;position:relative;display:flex;flex-direction:column}
.wr-s::before{content:'';position:absolute;right:-90px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.wr-k{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.wr-e{font-size:3.4rem;margin:18px 0 6px;line-height:1}
.wr-big{font-size:3rem;font-weight:800;letter-spacing:-.04em;line-height:1.05;overflow-wrap:anywhere}
.wr-t{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-top:6px;overflow-wrap:anywhere}
.wr-sub{font-size:.95rem;opacity:.88;margin-top:10px;line-height:1.45}
.wr-bars{margin-top:22px;display:flex;flex-direction:column;gap:14px}
.wr-b{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;font-size:.88rem;font-weight:700}.wr-b span{min-width:0;overflow-wrap:anywhere}
.wr-tr{flex-basis:100%;height:9px;border-radius:6px;background:rgba(255,255,255,.22);overflow:hidden}.wr-tr i{display:block;height:100%;background:#fff;border-radius:6px}
.wr-st{margin-top:22px;background:rgba(255,255,255,.14);border-radius:20px;padding:4px 16px}
.wr-st div{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:2px 12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.15);font-size:.88rem}.wr-st div:first-child{border-top:none}
.wr-st span{opacity:.85}.wr-st b{text-align:right;margin-left:auto;overflow-wrap:anywhere}
.wr-foot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:#0B0A1F}
.wr-amt{flex:1;min-height:46px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-weight:800;font-size:.85rem;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wr-amt.on{background:rgba(255,255,255,.26)}
.wr-btn{min-height:46px;min-width:50px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-weight:800;font-size:1rem;padding:0 14px}.wr-btn.main{background:#fff;color:#17133A;padding:0 20px}
.wrapc{border-left-color:#EC4899!important;background:linear-gradient(110deg,color-mix(in srgb,#EC4899 12%,var(--card)),var(--card))}.wrapc .ic{background:#EC48991f}
.smsraw{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:.8rem;line-height:1.45;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
html,body{background:var(--bg)}
#app{overflow-x:clip}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overscroll-behavior-y:none;min-height:100vh}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:inherit}
#app{max-width:560px;margin:0 auto;padding:0 16px calc(112px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 2px 12px;background:linear-gradient(var(--bg) 75%,transparent)}
.hello{font-size:.76rem;color:var(--mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top>div:first-child{flex:1 1 auto;min-width:0}
header.top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-size:1.65rem;font-weight:800;letter-spacing:-.035em;line-height:1.15}
h1.sm{font-size:1.25rem}
.hact{display:flex;gap:6px;align-items:center;flex:0 0 auto}
/* sync status is just a coloured dot (tap it to sync and see the status) */
.sync{width:36px;padding:0!important;justify-content:center}.sync span{display:none!important}.sync i{width:10px;height:10px}
@media (max-width:430px){.sync{padding:0 10px}.sync span{max-width:64px;overflow:hidden;text-overflow:ellipsis}h1{font-size:1.45rem}}
@media (max-width:370px){.sync span{display:none}.sync{width:36px;padding:0;justify-content:center}.hact{gap:5px}}
.nav .tb{min-width:0;white-space:nowrap}
.sync{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.72rem;font-weight:700;color:var(--mute);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.ok i{background:var(--green)}.sync.pend i{background:var(--amber)}.sync.busy i{background:var(--blue);animation:pulse 1s infinite}.sync.err i{background:var(--red)}
.iconbtn{width:36px;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--mute)}
.iconbtn.on{color:var(--acc);border-color:var(--acc)}
.iconbtn{position:relative}.iconbtn .badge{top:-6px;right:-6px}
.iconbtn.bellgo svg{animation:bellgo 1.2s ease 1}
@keyframes bellgo{10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-12deg)}50%{transform:none}}
.ibx-h{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:18px 4px 8px}
.ibx-h:first-child{margin-top:4px}
.sheet .alert{box-shadow:none;background:var(--soft);border-color:transparent}
.iconbtn svg,.tb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fadein{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@keyframes pulse{50%{opacity:.3}}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.hero{--hc:#5B5BF7;position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 18px;color:var(--ink);background:radial-gradient(140% 130% at 100% 0%,color-mix(in srgb,var(--hc) 20%,var(--card)) 0%,color-mix(in srgb,var(--hc) 6%,var(--card)) 45%,var(--card) 80%);border:1px solid color-mix(in srgb,var(--hc) 16%,var(--line));box-shadow:var(--sh);margin-bottom:14px}
.hero::after{content:'';position:absolute;right:-46px;top:-56px;width:180px;height:180px;border-radius:50%;background:color-mix(in srgb,var(--hc) 9%,transparent)}
.hero>*{position:relative;z-index:1}
.hl{font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--hc)}
.hv{font-size:2.3rem;font-weight:800;letter-spacing:-.045em;margin:4px 0 10px;line-height:1.1}
.hs{font-size:.8rem;color:var(--mute);margin-top:6px;font-weight:600}
.hs b{color:var(--ink);font-weight:800}
.hbar{height:8px;border-radius:8px;background:color-mix(in srgb,var(--hc) 12%,var(--soft));overflow:hidden}
.hbar i{display:block;height:100%;background:var(--hc);border-radius:8px;transition:width .5s}
.hbar.over i{background:var(--red)}
.strip{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.strip::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.acard{flex:0 0 auto;min-width:142px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--sh);scroll-snap-align:start;display:flex;flex-direction:column;gap:1px}
.acard span{font-size:.74rem;color:var(--mute);font-weight:600;white-space:nowrap}
.acard b{font-size:1.08rem;font-weight:800;letter-spacing:-.02em}
.acard small{font-size:.66rem;color:var(--faint);font-weight:600}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.mnav b{font-size:.95rem;font-weight:800}
.mnav button{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:1.2rem;color:var(--ink)}
.mnav button:disabled{opacity:.3}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.8rem;font-weight:700;color:var(--mute);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.sheet .chip{background:var(--soft);border-color:transparent}
.chip small{font-size:.7rem;opacity:.7;font-weight:600}
.chip.on,.sheet .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.emo{font-size:1.25rem;width:46px;justify-content:center;padding:0}
.chip.sw{width:36px;min-height:36px;height:36px;padding:0;border:3px solid var(--card)!important;box-shadow:0 0 0 1px var(--line)}
.chip.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.chip.x{background:var(--acc2);color:var(--acc);border-color:transparent}
.search{margin-bottom:10px}
.search input{background:var(--card);border:1px solid var(--line)}
.day{display:flex;justify-content:space-between;font-size:.7rem;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:18px 6px 8px}
.group{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);overflow:hidden}
.sheet .group{box-shadow:none;background:var(--soft);border-color:transparent}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item:active{background:var(--soft)}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.2rem;flex:0 0 auto}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;text-align:left}
.mid b{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{font-size:.74rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:800;font-size:.95rem;white-space:nowrap;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.card h2{font-size:1rem;font-weight:800;letter-spacing:-.02em;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font-size:.72rem;color:var(--mute);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 10px 11px 12px;box-shadow:var(--sh);min-width:0;container-type:inline-size}
.kpi span{display:block;font-size:min(.6rem,13cqi);font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;line-height:1.25;overflow-wrap:break-word}
.kpi b{display:block;font-size:min(.98rem,23cqi);font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{display:block;font-size:min(.64rem,14cqi);color:var(--mute);font-weight:600;line-height:1.3;overflow-wrap:break-word}
.kpi .dl{display:block;font-style:normal;font-size:min(.6rem,13cqi);font-weight:800;line-height:1.3;margin-top:3px;letter-spacing:-.01em}
.kpi .dl i{font-style:normal}
.hint.cmpk{margin:2px 6px 0;font-size:.7rem}
.cmpbar{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 12px 10px;margin:12px 0 4px;box-shadow:var(--sh)}
.alert .mid small,.alert .mid b{white-space:normal}
.alert .accs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.alert .accs .chip{min-height:30px;padding:0 10px;font-size:.72rem;background:var(--acc2);color:var(--acc);border-color:transparent}
.more{display:block;width:100%;text-align:center;font-size:.76rem;font-weight:800;color:var(--acc);padding:2px 0 12px}
.alert.info{border-left-color:var(--acc)}
.alert.warn{border-left-color:var(--red)}
.alert .ax{flex:0 0 auto;width:28px;height:28px;border-radius:9px;background:var(--soft);color:var(--mute);font-size:.7rem;font-weight:800}
.alert .ago{flex:0 0 auto;font-size:.74rem;font-weight:800;color:var(--acc);padding:6px 4px}
.qa{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin-top:4px}
.qa::-webkit-scrollbar{display:none}
.qa .chip{background:var(--acc2)!important;color:var(--acc)}
.stmt td{padding:9px 0;border-top:1px solid var(--line);font-size:.82rem;vertical-align:top}
.stmt tr:first-child td{border-top:none}
.stmt td.r{text-align:right;white-space:nowrap;font-weight:800}
.stmt td small{display:block;color:var(--mute);font-size:.7rem;font-weight:600}
input,select{width:100%;height:48px;background:var(--soft);border:1.5px solid transparent;border-radius:14px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);appearance:none;-webkit-appearance:none}
input:focus,select:focus{outline:none;border-color:var(--acc);background:var(--card)}
input::placeholder{color:var(--faint)}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23A6ABBA' stroke-width='2'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:34px}
input[type=checkbox]{width:22px;height:22px;appearance:auto;-webkit-appearance:auto;accent-color:var(--acc);flex:0 0 auto}
.lbl{font-size:.7rem;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:16px 2px 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
input[type=date],input[type=month],input[type=time]{min-width:0;max-width:100%}
.sh-body{overflow-x:hidden}

.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:50px;border-radius:16px;background:var(--acc);color:#fff;font-weight:800;font-size:.95rem;margin-top:10px;padding:0 16px;transition:transform .1s}

.btn.sec{background:var(--soft);color:var(--ink)}
.btn.dng{background:transparent;color:var(--red);border:1.5px solid color-mix(in srgb,var(--red) 40%,transparent)}
.btn.sm{min-height:38px;font-size:.8rem;border-radius:12px;width:auto;padding:0 14px;margin:0}

.btns{display:flex;gap:8px;margin-top:12px}
.btns .btn{flex:1;margin:0}
.seg{display:flex;background:var(--soft);padding:4px;border-radius:15px;gap:2px;margin-bottom:14px}

.seg button{flex:1;min-width:0;height:38px;border-radius:11px;font-size:min(.8rem,3.4vw);font-weight:800;color:var(--mute);white-space:nowrap;padding:0 4px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:18px;background:var(--soft);border:2px solid transparent;transition:.15s}

.tile small{font-size:.66rem;font-weight:800;color:var(--mute);text-align:center;line-height:1.15}
.tile.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--card))}
.tile.on small{color:var(--ink)}
.amtbox{display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 0 0}
.amtbox span{font-size:2rem;font-weight:700;color:var(--faint)}

.when{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

.box{background:var(--soft);border-radius:18px;padding:4px 12px 12px;margin-top:10px}
.box .chip{background:var(--card)}
.box input{background:var(--card)}
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.nav .in{pointer-events:auto;max-width:520px;margin:0 auto;display:flex;align-items:center;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;box-shadow:0 10px 30px rgba(15,18,34,.12);height:68px;padding:0 6px}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:min(.62rem,3.1vw);font-weight:800;color:var(--faint)}

.tb.on{color:var(--acc)}
.tb{position:relative}
.badge{position:absolute;top:-4px;right:calc(50% - 20px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:.6rem;font-weight:800;font-style:normal;display:grid;place-items:center;padding:0 4px}

.fab{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,#8B7BFF,#5B5BF7);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(91,91,247,.4);margin:0 4px;transform:translateY(-12px);transition:transform .15s}

.fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}
.scrim{position:fixed;inset:0;background:rgba(6,8,14,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;max-height:88vh;max-height:calc(100dvh - 24px);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.25,1);box-shadow:0 -10px 40px rgba(0,0,0,.16);overflow:hidden}
.sheet.open{transform:none}
.sheet.drag{transition:none}
.sheet.tall{height:88vh;height:calc(100dvh - 24px)}
.grab{width:44px;height:5px;border-radius:5px;background:var(--faint);opacity:.5;margin:8px auto 0;flex:0 0 auto}
.sh-top{flex:0 0 auto;touch-action:none;background:var(--card);border-bottom:1px solid var(--line)}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:6px 14px 8px 18px;min-height:48px;gap:10px}
.sh-head h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{flex:0 0 auto;width:40px!important;height:40px;font-size:1rem}
.sh-head h3{font-size:1.1rem;font-weight:800;letter-spacing:-.02em}
.x{width:34px;height:34px;border-radius:12px;background:var(--soft);color:var(--mute);font-weight:800}
.sh-body{padding:4px 18px calc(28px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.detail{text-align:center;padding:4px 0 16px}
.ic.big{width:62px;height:62px;font-size:1.75rem;border-radius:20px;margin:0 auto 10px}
.dv{font-size:2.1rem;font-weight:800;letter-spacing:-.045em}
.dt{color:var(--mute);font-weight:600;font-size:.88rem;margin-top:2px}
.kv{background:var(--soft);border-radius:16px;padding:2px 14px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:.88rem}
.kv div:first-child{border-top:none}
.kv span{color:var(--mute)}
.kv b{text-align:right}
.kv a{color:var(--acc);font-weight:800;text-decoration:none}
.hint{font-size:.76rem;color:var(--mute);margin:8px 2px;line-height:1.5}
.hint.center{text-align:center}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:15px;font-size:.85rem;font-weight:700;z-index:90;opacity:0;pointer-events:none;transition:.25s;display:flex;gap:16px;align-items:center;max-width:92%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#A5A6FF;font-weight:800}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;transition:width .5s}
.brow{padding:11px 0;border-top:1px solid var(--line);display:block;width:100%;text-align:left}

.brow .h{display:flex;justify-content:space-between;align-items:center;font-size:.86rem;margin-bottom:7px;gap:8px}
.brow .h span:first-child{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{position:relative;height:220px}
.chart.donut{height:210px;margin-bottom:6px}
.chart .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.chart .center small{display:block;font-size:.68rem;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.chart .center b{font-size:1.25rem;font-weight:800;letter-spacing:-.03em}
.alert{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:16px;padding:10px 12px;margin-bottom:10px;box-shadow:var(--sh)}
.alert.over{border-left-color:var(--red)}
.gcard,.ecard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--sh);margin-bottom:12px}
.ghead{display:flex;gap:14px;align-items:center;width:100%;text-align:left}
.rw{position:relative;width:64px;height:64px;flex:0 0 auto}
.ring{width:64px;height:64px;display:block}
.ring circle{transition:stroke-dashoffset .7s}
.rw span{position:absolute;inset:0;display:grid;place-items:center;font-size:1.5rem}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.05rem;flex:0 0 auto;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.av.big{width:64px;height:64px;font-size:1.5rem;margin:0 auto 10px}
.tag{font-style:normal;font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:var(--acc2);color:var(--acc);vertical-align:middle;margin-left:4px}
.empty{text-align:center;color:var(--mute);padding:30px 12px;font-size:.88rem;line-height:1.5}
.empty .big{font-size:2.2rem;display:block;margin-bottom:6px}
.srow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.card .srow:first-of-type{border-top:none}
.mv{width:32px;height:32px;border-radius:10px;background:var(--soft);color:var(--mute);font-weight:800;flex:0 0 auto}
.check{display:flex;align-items:center;gap:10px;margin:16px 2px 4px;font-size:.88rem;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:6px 6px 6px 12px;font-size:.8rem;font-weight:700}
.pill button{width:22px;height:22px;border-radius:50%;background:var(--card);color:var(--mute);font-size:.7rem}
.addrow{display:flex;gap:8px}
.addrow .btn{flex:0 0 auto}
.obr{display:grid;grid-template-columns:1.3fr 1fr;gap:8px;background:var(--soft);padding:10px;border-radius:18px;margin-bottom:8px}
.obr .obo{grid-column:1/-1}
.obr input,.obr select{background:var(--card)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal b{font-size:.62rem;color:var(--mute);text-align:center;font-weight:800}
.cd{aspect-ratio:1;border-radius:10px;font-size:.72rem;font-weight:700;display:grid;place-items:center}
.cd.today{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:.66rem;color:var(--mute);font-weight:700;margin-top:10px}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}
.flow{width:100%;height:auto;display:block}
.flow text{font-family:inherit;font-size:9px;font-weight:700;fill:var(--ink)}
.flow text.v{fill:var(--mute);font-weight:600}
.toprem{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:20px}
.lock[hidden]{display:none}
.lk{text-align:center;width:100%;max-width:310px}
.logo{width:72px;height:72px;border-radius:22px;margin:0 auto 18px;display:grid;place-items:center;box-shadow:0 14px 30px rgba(61,47,208,.35);overflow:hidden}
.logo .mark,.sp-logo .mark{width:100%;height:100%;display:block}
#splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:radial-gradient(120% 80% at 50% 40%,#2A2178 0%,#17133A 55%,#0B0A1F 100%);color:#fff;transition:opacity .5s ease,transform .5s ease}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.sp-glow{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(139,108,255,.55),transparent 65%);filter:blur(10px);opacity:0}
.sp-logo{width:104px;height:104px;border-radius:30px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08);transform:scale(.55);opacity:0}
.sp-name{font-size:1.9rem;font-weight:800;letter-spacing:-.04em;margin-top:18px;opacity:0;transform:translateY(10px)}
.sp-tag{font-size:.85rem;font-weight:600;color:#B8B3E6;opacity:0;transform:translateY(8px)}
#splash.go .sp-logo{animation:spPop .7s cubic-bezier(.2,1.4,.3,1) forwards}
#splash.go .sp-glow{animation:spGlow 1.3s ease forwards}
#splash.go .sp-name{animation:spUp .5s .35s ease forwards}
#splash.go .sp-tag{animation:spUp .5s .5s ease forwards}
#splash .mk-r{stroke-dasharray:140;stroke-dashoffset:140}
#splash.go .mk-r{animation:spDraw .8s .2s ease forwards}
#splash .mk-g{stroke-dasharray:30;stroke-dashoffset:30}
#splash.go .mk-g{animation:spDraw .4s .85s ease forwards}
@keyframes spPop{to{transform:scale(1);opacity:1}}
@keyframes spGlow{40%{opacity:1}100%{opacity:.6}}
@keyframes spUp{to{opacity:1;transform:none}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}

.red{color:var(--red)}.green{color:var(--green)}.amber{color:var(--amber)}.blue{color:var(--blue)}.acc{color:var(--acc)}.mute{color:var(--mute)}

.mdiv{font-size:1rem;font-weight:800;letter-spacing:-.02em;margin:26px 4px 0}

/* ---------- defaults ---------- */
const CAT_DEF = [['Food', '🍽️', '#F97316'], ['Household', '🏠', '#EAB308'], ['Transportation', '🚕', '#14B8A6'], ['Personal & Lifestyle', '🛍️', '#A855F7'], ['Education', '📚', '#3B82F6'], ['Medical', '💊', '#EC4899'], ['Financial', '💳', '#64748B'], ['Miscellaneous', '✨', '#84CC16']];

const CLOUD = { url: '__SHEET_URL__', clientId: '__WEB_CLIENT_ID__' };
const cloudOk = () => /^https:\/\/script\.google\.com\/.+\/exec$/.test(CLOUD.url) && /\.apps\.googleusercontent\.com$/.test(CLOUD.clientId);

const LOGO = (id = 'lg') => `<svg viewBox="0 0 108 108" class="mark"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17133A"/><stop offset=".55" stop-color="#3D2FD0"/><stop offset="1" stop-color="#8B6CFF"/></linearGradient></defs><rect width="108" height="108" rx="30" fill="url(#${id})"/><circle cx="82" cy="22" r="26" fill="#B8A8FF" opacity=".2"/><path class="mk-r" d="M39 35H69M39 45.5H69M45 35C63 35 63 58 45 58H41M45 58L65 74" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="mk-g" d="M39 80H69" stroke="#F5C46B" stroke-width="4" stroke-linecap="round"/></svg>`;
const EYE = '<svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24"><path d="M17.9 17.9A10.8 10.8 0 0 1 12 19C5 19 1 12 1 12a19.6 19.6 0 0 1 5.1-5.9M9.9 5.2A10 10 0 0 1 12 5c7 0 11 7 11 7a19.7 19.7 0 0 1-2.2 3.2M14.1 14.2a3 3 0 1 1-4.2-4.3M1 1l22 22"/></svg>';

/* ---------- state ---------- */

/* ---------- local apply / commit ---------- */

/* ---------- balances (until = exclusive end timestamp, optional) ---------- */
function calc(until) {

/* ---------- goal deadlines ---------- */
function goalPlan(g) {
  const t = +g.target || 0, s = C.saved[g.id] || 0; if (!g.deadline || !t || g.archived) return null;

  const start = (g.created || td).slice(0, 10), total = Math.max(1, dayDiff(start, g.deadline)), el = Math.max(0, dayDiff(start, td));

  return `<small style="font-weight:700">📅 By ${by} · save <b>${inr(P.need)}</b>/month${P.behind ? ` · <span class="red">behind by ${inr(P.behind)}</span>` : ' · <span class="green">on track</span>'}</small>`;

function flowSvg(r, ex) {

  S.loan.filter(e => inR(e) && accOk(e.account) && e.account).forEach(e => { if (e.action === 'Borrow') add('L:Borrowed', 'A:' + e.account, e.amount); else if (e.action === 'Receive') add('L:Paid back to you', 'A:' + e.account, e.amount); else if (e.action === 'Lend') add('A:' + e.account, 'R:Lent', e.amount); else if (e.action === 'Repay') add('A:' + e.account, 'R:Loan repaid', e.amount); });
  const ct = {}; ex.forEach(e => ct[e.category] = (ct[e.category] || 0) + e.amount);
  const topC = Object.keys(ct).sort((a, b) => ct[b] - ct[a]), keep = new Set(topC.slice(0, 6));
  ex.forEach(e => add('A:' + e.account, 'R:' + (keep.has(e.category) ? e.category : 'Other'), e.amount));
  S.emi.filter(e => inR(e) && accOk(e.account)).forEach(e => add('A:' + e.account, 'R:EMIs', e.amount));

  S.inv.filter(e => inR(e) && !isBuy(e) && accOk(e.to)).forEach(e => { add('L:Investments sold', 'A:' + e.to, e.amount); });
  const links = Object.entries(lk).map(([k, v]) => { const [s, t] = k.split('|'); return { s, t, v }; });
  if (!links.length) return '<div class="empty">No money movement in this period.</div>';
  const nodes = {}; const node = id => nodes[id] || (nodes[id] = { id, col: id[0] === 'L' ? 0 : id[0] === 'A' ? 1 : 2, label: id.slice(2), inV: 0, outV: 0 });
  links.forEach(l => { node(l.s).outV += l.v; node(l.t).inV += l.v; });
  const cols = [[], [], []]; Object.values(nodes).forEach(nd => { nd.val = Math.max(nd.inV, nd.outV); cols[nd.col].push(nd); });

  cols.forEach(c => { const ch = c.reduce((s, nd) => s + Math.max(3, nd.val * k), 0) + (c.length - 1) * gap; let y = (H - ch) / 2; c.forEach(nd => { nd.y = y; nd.h = Math.max(3, nd.val * k); nd.io = nd.y + (nd.h - nd.inV * k) / 2; nd.oo = nd.y + (nd.h - nd.outV * k) / 2; y += nd.h + gap; }); });
  const SPECIAL = { EMIs: '#A855F7', Invested: '#2F7BF5', Lent: '#F59E0B', 'Loan repaid': '#E5484D', Other: '#94A3B8' };
  const colorOf = nd => nd.col === 2 ? (SPECIAL[nd.label] || cat(nd.label).color) : nd.col === 0 ? '#11A04F' : SWATCH[cols[1].indexOf(nd) % SWATCH.length];
  links.sort((a, b) => nodes[a.s].y - nodes[b.s].y || nodes[a.t].y - nodes[b.t].y);
  let paths = '';
  links.forEach(l => { const s = nodes[l.s], t = nodes[l.t], th = l.v * k, x0 = X[s.col] + NW, x1 = X[t.col], y0 = s.oo, y1 = t.io, mx = (x0 + x1) / 2; s.oo += th; t.io += th;
    paths += `<path d="M${x0},${y0} C${mx},${y0} ${mx},${y1} ${x1},${y1} L${x1},${y1 + th} C${mx},${y1 + th} ${mx},${y0 + th} ${x0},${y0 + th} Z" fill="${colorOf(s.col === 1 ? t : s)}" fill-opacity=".28"><title>${esc(s.label)} → ${esc(t.label)}: ${S.hide ? '' : fmtINR(l.v)}</title></path>`; });

    else if (nd.col === 2) labels += `<text x="${X[2] + NW + 5}" y="${cy - 1}">${esc(short(nd.label))}</text><text class="v" x="${X[2] + NW + 5}" y="${cy + 9}">${v}</text>`;

/* ---------- LOCK: phone's lock (fingerprint / face / pattern / PIN), app PIN, password or pattern ----------

const LOCK_T = () => [['none', '🔓', 'None'], ...(AND ? [['device', '👆', "Phone's lock"]] : []), ['pin', '🔢', 'PIN'], ['pwd', '🔤', 'Password'], ['pat', '⣿', 'Pattern']];

async function setSecret(kind, v) { const salt = Math.random().toString(36).slice(2) + Date.now().toString(36); S.sec = { kind, salt, h: await hashSecret(v, salt) }; S.pin = ''; }
function unlocked() { const L = $('#lock'); L.classList.add('bye'); setTimeout(() => { L.hidden = true; L.classList.remove('bye', 'intro'); }, 340); U.pin = null; if (S.url && S.key && Date.now() - lastPull > 60000) pull(true); }
/* which secret the lock screen asks for: the lock type, or the app secret as a backup for the phone's lock */
/* fingerprint is offered as a button whenever the Android app can use it; the PIN / pattern / password always stays on screen */
const canBio = () => { if (!AND) return false; if (U.bioOk == null) U.bioOk = !!andInfo().bio; return U.bioOk; };
function showLock(mode, kind, intro) {

  U.pin = { mode, kind, val: '', first: '', seq: [] }; const L = $('#lock'); L.classList.remove('bye'); L.classList.toggle('intro', !!intro); L.hidden = false; drawLock();
}
function bioAsk() { if (!AND || !U.pin || $('#lock').hidden) return; U.noLock = Date.now() + 60000; try { AND.unlock('Unlock Ledger'); } catch (e) { } }
window.onLedgerUnlock = (ok, msg) => {

};
function drawLock() {
  const P = U.pin, L = $('#lock'), set = P.mode !== 'unlock' && P.mode !== 'turnOn';
  const word = { pin: 'PIN', pwd: 'password', pat: 'pattern' }[P.kind];
  let title = P.mode === 'unlock' ? (P.kind === 'device' ? 'Ledger is locked' : 'Enter your ' + word) : P.mode === 'set1' ? 'Choose a ' + (P.kind === 'pin' ? '4-digit PIN' : P.kind === 'pwd' ? 'password (4+ characters)' : 'pattern (join 4+ dots)') : P.mode === 'set2' ? (P.kind === 'pat' ? 'Draw it again' : 'Type it again') : P.mode === 'verify' ? 'Confirm your current ' + word : 'Ledger';

  else if (P.kind === 'pin') mid = `<div class="dots" id="dots">${[0, 1, 2, 3].map(i => `<i class="${i < P.val.length ? 'on' : ''}"></i>`).join('')}</div><div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => k === '' ? '<span></span>' : `<button class="pk ${k === '⌫' ? 't' : ''}" data-act="pinKey" data-k="${k}">${k}</button>`).join('')}</div>`;

  else mid = `<div class="patw"><svg id="patSvg" viewBox="0 0 300 300"><polyline id="patLine" points="" /></svg>${[0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => `<i class="pd" data-i="${i}" style="left:${(i % 3) * 33.333 + 16.667}%;top:${Math.floor(i / 3) * 33.333 + 16.667}%"></i>`).join('')}</div>`;

  if (P.kind === 'pwd') setTimeout(() => { const i = $('#pwIn'); if (i) { i.focus(); i.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); ACT.pwGo(); } }; } }, 60);

function lockFail() { buzz([30, 40, 30]); const d = $('#dots') || $('.patw') || $('#pwIn'); if (d) { d.classList.add('shake'); setTimeout(() => d.classList.remove('shake'), 380); } }
/* one place for every secret type: unlock, verify the old one, or set a new one */
async function lockInput(v) {
  const P = U.pin;
  if (P.mode === 'unlock' || P.mode === 'verify') {
    if (await checkSecret(P.kind, v)) { if (P.mode === 'unlock') return unlocked(); const nx = P.next; U.pin = null; $('#lock').hidden = true; return nx && nx(); }

  if (v === P.first) { await setSecret(P.kind, v); if (!P.backup) S.lock.type = P.kind; save(); $('#lock').hidden = true; U.pin = null; toast(P.backup ? 'Backup PIN saved 🔒' : { pin: 'PIN', pwd: 'Password', pat: 'Pattern' }[P.kind] + ' lock on 🔒'); return render(); }
  toast("They didn't match. Try again."); P.mode = 'set1'; P.val = ''; P.first = ''; P.seq = []; drawLock();

ACT.pinKey = el => {
  const P = U.pin, k = el.dataset.k; buzz(5); if (!P || P.kind !== 'pin') return;
  if (k === '⌫') { P.val = P.val.slice(0, -1); return drawLock(); }
  if (P.val.length >= 4) return; P.val += k; drawLock(); if (P.val.length === 4) setTimeout(() => lockInput(P.val), 140);

ACT.pwGo = () => { const v = ($('#pwIn') || {}).value || ''; if (!v) return; lockInput(v); };
function patBind() {
  const w = $('.patw'), svg = $('#patSvg'), line = $('#patLine'), P = U.pin; let on = false;
  const pt = e => { const r = w.getBoundingClientRect(), t = e.touches ? e.touches[0] : e; return [(t.clientX - r.left) * 300 / r.width, (t.clientY - r.top) * 300 / r.height]; };
  const hit = ([x, y]) => { for (let i = 0; i < 9; i++) { const cx = (i % 3) * 100 + 50, cy = Math.floor(i / 3) * 100 + 50; if ((x - cx) ** 2 + (y - cy) ** 2 < 34 ** 2) return i; } return -1; };

ACT.pinCancel = () => { $('#lock').hidden = true; U.pin = null; render(); };

/* settings: changing the lock first asks for the current app secret (if there is one) */

/* when to lock again */
