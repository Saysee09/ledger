<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7FB" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<title>Ledger</title>
<link rel="apple-touch-icon" id="appleIcon">
<link rel="icon" id="favIcon">
<link rel="manifest" id="manifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#F6F7FB;--card:#FFFFFF;--ink:#0F1222;--mute:#687086;--faint:#A6ABBA;--line:#E9EBF2;--soft:#F2F4F8;--acc:#5B5BF7;--acc2:#EEEEFF;--green:#11A04F;--red:#E5484D;--amber:#D98200;--blue:#2F7BF5;--sh:0 1px 2px rgba(15,18,34,.04),0 6px 20px rgba(15,18,34,.05);color-scheme:light}
[data-theme=dark]{--bg:#0B0D14;--card:#151824;--ink:#ECEEF6;--mute:#8E94AA;--faint:#585E72;--line:#242838;--soft:#1C2030;--acc:#8183FF;--acc2:#23255A;--green:#3DD68C;--red:#FF6B6E;--amber:#FFB224;--blue:#5EA2FF;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overscroll-behavior-y:none;min-height:100vh}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:inherit}
#app{max-width:560px;margin:0 auto;padding:0 16px calc(112px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 2px 12px;background:linear-gradient(var(--bg) 75%,transparent)}
.hello{font-size:.76rem;color:var(--mute);font-weight:600}
h1{font-size:1.65rem;font-weight:800;letter-spacing:-.035em;line-height:1.15}
.hact{display:flex;gap:7px;align-items:center}
.sync{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.72rem;font-weight:700;color:var(--mute);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.ok i{background:var(--green)}.sync.pend i{background:var(--amber)}.sync.busy i{background:var(--blue);animation:pulse 1s infinite}.sync.err i{background:var(--red)}
.iconbtn{width:36px;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--mute)}
.iconbtn.on{color:var(--acc);border-color:var(--acc)}
.iconbtn svg,.tb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fadein{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@keyframes pulse{50%{opacity:.3}}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.hero{--hc:#5B5BF7;position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 18px;color:var(--ink);background:radial-gradient(140% 130% at 100% 0%,color-mix(in srgb,var(--hc) 20%,var(--card)) 0%,color-mix(in srgb,var(--hc) 6%,var(--card)) 45%,var(--card) 80%);border:1px solid color-mix(in srgb,var(--hc) 16%,var(--line));box-shadow:var(--sh);margin-bottom:14px}
.hero::after{content:'';position:absolute;right:-46px;top:-56px;width:180px;height:180px;border-radius:50%;background:color-mix(in srgb,var(--hc) 9%,transparent)}
.hero>*{position:relative;z-index:1}
.hl{font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--hc)}
.hv{font-size:2.3rem;font-weight:800;letter-spacing:-.045em;margin:4px 0 10px;line-height:1.1}
.hs{font-size:.8rem;color:var(--mute);margin-top:6px;font-weight:600}
.hs b{color:var(--ink);font-weight:800}
.hbar{height:8px;border-radius:8px;background:color-mix(in srgb,var(--hc) 12%,var(--soft));overflow:hidden}
.hbar i{display:block;height:100%;background:var(--hc);border-radius:8px;transition:width .5s}
.hbar.over i{background:var(--red)}
.strip{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.strip::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.acard{flex:0 0 auto;min-width:142px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--sh);scroll-snap-align:start;display:flex;flex-direction:column;gap:1px}
.acard span{font-size:.74rem;color:var(--mute);font-weight:600;white-space:nowrap}
.acard b{font-size:1.08rem;font-weight:800;letter-spacing:-.02em}
.acard small{font-size:.66rem;color:var(--faint);font-weight:600}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.mnav b{font-size:.95rem;font-weight:800}
.mnav button{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:1.2rem;color:var(--ink)}
.mnav button:disabled{opacity:.3}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.8rem;font-weight:700;color:var(--mute);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.sheet .chip{background:var(--soft);border-color:transparent}
.chip small{font-size:.7rem;opacity:.7;font-weight:600}
.chip.on,.sheet .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.emo{font-size:1.25rem;width:46px;justify-content:center;padding:0}
.chip.sw{width:36px;min-height:36px;height:36px;padding:0;border:3px solid var(--card)!important;box-shadow:0 0 0 1px var(--line)}
.chip.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.chip.x{background:var(--acc2);color:var(--acc);border-color:transparent}
.search{margin-bottom:10px}
.search input{background:var(--card);border:1px solid var(--line)}
.day{display:flex;justify-content:space-between;font-size:.7rem;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:18px 6px 8px}
.group{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);overflow:hidden}
.sheet .group{box-shadow:none;background:var(--soft);border-color:transparent}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item:active{background:var(--soft)}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.2rem;flex:0 0 auto}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;text-align:left}
.mid b{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{font-size:.74rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:800;font-size:.95rem;white-space:nowrap;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.card h2{font-size:1rem;font-weight:800;letter-spacing:-.02em;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font-size:.72rem;color:var(--mute);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 12px;box-shadow:var(--sh);min-width:0}
.kpi span{display:block;font-size:.6rem;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{display:block;font-size:.98rem;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{display:block;font-size:.64rem;color:var(--mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .dl{display:block;font-style:normal;font-size:.6rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;letter-spacing:-.01em}
.kpi .dl i{font-style:normal}
.hint.cmpk{margin:2px 6px 0;font-size:.7rem}
.cmpbar{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 12px 10px;margin:12px 0 4px;box-shadow:var(--sh)}
.alert .mid small,.alert .mid b{white-space:normal}
.alert .accs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.alert .accs .chip{min-height:30px;padding:0 10px;font-size:.72rem;background:var(--acc2);color:var(--acc);border-color:transparent}
.more{display:block;width:100%;text-align:center;font-size:.76rem;font-weight:800;color:var(--acc);padding:2px 0 12px}
.alert.info{border-left-color:var(--acc)}
.alert.warn{border-left-color:var(--red)}
.alert .ax{flex:0 0 auto;width:28px;height:28px;border-radius:9px;background:var(--soft);color:var(--mute);font-size:.7rem;font-weight:800}
.alert .ago{flex:0 0 auto;font-size:.74rem;font-weight:800;color:var(--acc);padding:6px 4px}
.qa{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin-top:4px}
.qa::-webkit-scrollbar{display:none}
.qa .chip{background:var(--acc2)!important;color:var(--acc)}
.stmt td{padding:9px 0;border-top:1px solid var(--line);font-size:.82rem;vertical-align:top}
.stmt tr:first-child td{border-top:none}
.stmt td.r{text-align:right;white-space:nowrap;font-weight:800}
.stmt td small{display:block;color:var(--mute);font-size:.7rem;font-weight:600}
input,select{width:100%;height:48px;background:var(--soft);border:1.5px solid transparent;border-radius:14px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);appearance:none;-webkit-appearance:none}
input:focus,select:focus{outline:none;border-color:var(--acc);background:var(--card)}
input::placeholder{color:var(--faint)}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23A6ABBA' stroke-width='2'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:34px}
input[type=checkbox]{width:22px;height:22px;appearance:auto;-webkit-appearance:auto;accent-color:var(--acc);flex:0 0 auto}
.lbl{font-size:.7rem;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:16px 2px 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:50px;border-radius:16px;background:var(--acc);color:#fff;font-weight:800;font-size:.95rem;margin-top:10px;padding:0 16px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.dng{background:transparent;color:var(--red);border:1.5px solid color-mix(in srgb,var(--red) 40%,transparent)}
.btn.sm{min-height:38px;font-size:.8rem;border-radius:12px;width:auto;padding:0 14px;margin:0}
.btn.big{min-height:56px;font-size:1rem;margin-top:20px;box-shadow:0 10px 22px color-mix(in srgb,var(--acc) 30%,transparent)}
.btn:disabled{opacity:.6}
.btns{display:flex;gap:8px;margin-top:12px}
.btns .btn{flex:1;margin:0}
.seg{display:flex;background:var(--soft);padding:4px;border-radius:15px;gap:2px;margin-bottom:14px}
#view .seg.page{background:color-mix(in srgb,var(--line) 75%,var(--bg))}
.seg button{flex:1;height:38px;border-radius:11px;font-size:.8rem;font-weight:800;color:var(--mute);white-space:nowrap;padding:0 4px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:18px;background:var(--soft);border:2px solid transparent;transition:.15s}
.tile span{font-size:1.45rem;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent)}
.tile small{font-size:.66rem;font-weight:800;color:var(--mute);text-align:center;line-height:1.15}
.tile.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--card))}
.tile.on small{color:var(--ink)}
.amtbox{display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 0 0}
.amtbox span{font-size:2rem;font-weight:700;color:var(--faint)}
.amtbox input{background:none!important;border:none!important;height:auto;font-size:3rem;font-weight:800;letter-spacing:-.045em;text-align:center;width:70%;padding:0;color:var(--ink)}
.amthint{text-align:center;font-size:.8rem;color:var(--mute);min-height:1.2em;font-weight:600}
.when{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.when input{flex:1;min-width:118px;height:38px;border-radius:999px;font-size:14px;font-weight:600}
.box{background:var(--soft);border-radius:18px;padding:4px 12px 12px;margin-top:10px}
.box .chip{background:var(--card)}
.box input{background:var(--card)}
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.nav .in{pointer-events:auto;max-width:520px;margin:0 auto;display:flex;align-items:center;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;box-shadow:0 10px 30px rgba(15,18,34,.12);height:68px;padding:0 6px}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.62rem;font-weight:800;color:var(--faint)}
.tb svg{width:22px;height:22px}
.tb.on{color:var(--acc)}
.tb{position:relative}
.badge{position:absolute;top:-4px;right:calc(50% - 20px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:.6rem;font-weight:800;font-style:normal;display:grid;place-items:center;padding:0 4px}
.badge[hidden]{display:none}
.fab{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,#8B7BFF,#5B5BF7);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(91,91,247,.4);margin:0 4px;transform:translateY(-12px);transition:transform .15s}
.fab:active{transform:translateY(-12px) scale(.94)}
.fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}
.scrim{position:fixed;inset:0;background:rgba(6,8,14,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;max-height:88vh;max-height:calc(100dvh - 24px);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.25,1);box-shadow:0 -10px 40px rgba(0,0,0,.16);overflow:hidden}
.sheet.open{transform:none}
.sheet.drag{transition:none}
.sheet.tall{height:88vh;height:calc(100dvh - 24px)}
.grab{width:44px;height:5px;border-radius:5px;background:var(--faint);opacity:.5;margin:8px auto 0;flex:0 0 auto}
.sh-top{flex:0 0 auto;touch-action:none;background:var(--card);border-bottom:1px solid var(--line)}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:6px 14px 8px 18px;min-height:48px;gap:10px}
.sh-head h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{flex:0 0 auto;width:40px!important;height:40px;font-size:1rem}
.sh-head h3{font-size:1.1rem;font-weight:800;letter-spacing:-.02em}
.x{width:34px;height:34px;border-radius:12px;background:var(--soft);color:var(--mute);font-weight:800}
.sh-body{padding:4px 18px calc(28px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.detail{text-align:center;padding:4px 0 16px}
.ic.big{width:62px;height:62px;font-size:1.75rem;border-radius:20px;margin:0 auto 10px}
.dv{font-size:2.1rem;font-weight:800;letter-spacing:-.045em}
.dt{color:var(--mute);font-weight:600;font-size:.88rem;margin-top:2px}
.kv{background:var(--soft);border-radius:16px;padding:2px 14px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:.88rem}
.kv div:first-child{border-top:none}
.kv span{color:var(--mute)}
.kv b{text-align:right}
.kv a{color:var(--acc);font-weight:800;text-decoration:none}
.hint{font-size:.76rem;color:var(--mute);margin:8px 2px;line-height:1.5}
.hint.center{text-align:center}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:15px;font-size:.85rem;font-weight:700;z-index:90;opacity:0;pointer-events:none;transition:.25s;display:flex;gap:16px;align-items:center;max-width:92%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#A5A6FF;font-weight:800}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;transition:width .5s}
.brow{padding:11px 0;border-top:1px solid var(--line);display:block;width:100%;text-align:left}
.brow:first-of-type{border-top:none}
.brow .h{display:flex;justify-content:space-between;align-items:center;font-size:.86rem;margin-bottom:7px;gap:8px}
.brow .h span:first-child{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{position:relative;height:220px}
.chart.donut{height:210px;margin-bottom:6px}
.chart .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.chart .center small{display:block;font-size:.68rem;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.chart .center b{font-size:1.25rem;font-weight:800;letter-spacing:-.03em}
.alert{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:16px;padding:10px 12px;margin-bottom:10px;box-shadow:var(--sh)}
.alert.over{border-left-color:var(--red)}
.gcard,.ecard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--sh);margin-bottom:12px}
.ghead{display:flex;gap:14px;align-items:center;width:100%;text-align:left}
.rw{position:relative;width:64px;height:64px;flex:0 0 auto}
.ring{width:64px;height:64px;display:block}
.ring circle{transition:stroke-dashoffset .7s}
.rw span{position:absolute;inset:0;display:grid;place-items:center;font-size:1.5rem}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.05rem;flex:0 0 auto;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.av.big{width:64px;height:64px;font-size:1.5rem;margin:0 auto 10px}
.tag{font-style:normal;font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:var(--acc2);color:var(--acc);vertical-align:middle;margin-left:4px}
.empty{text-align:center;color:var(--mute);padding:30px 12px;font-size:.88rem;line-height:1.5}
.empty .big{font-size:2.2rem;display:block;margin-bottom:6px}
.srow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.card .srow:first-of-type{border-top:none}
.mv{width:32px;height:32px;border-radius:10px;background:var(--soft);color:var(--mute);font-weight:800;flex:0 0 auto}
.check{display:flex;align-items:center;gap:10px;margin:16px 2px 4px;font-size:.88rem;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}

<script>
'use strict';
/* =========================================================

   ========================================================= */

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const fmtINR = (n, c) => {
  n = r2(n); const a = Math.abs(n); let s;
  if (c && a >= 1e7) s = (a / 1e7).toFixed(2).replace(/\.?0+$/, '') + 'Cr';

};
const inr = (n, c) => S.hide ? '₹ ••••' : fmtINR(n, c);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const p2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
const hm = d => p2(d.getHours()) + ':' + p2(d.getMinutes());
const nowTs = () => { const d = new Date(); return ymd(d) + ' ' + hm(d) + ':' + p2(d.getSeconds()); };
const today = () => ymd(new Date());
const ym = (d = new Date()) => d.getFullYear() + '-' + p2(d.getMonth() + 1);
const shiftM = (m, n) => { const [y, mo] = m.split('-').map(Number); return ym(new Date(y, mo - 1 + n, 1)); };
const daysIn = m => new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate();
const addDays = (d, n) => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return ymd(x); };
const dayDiff = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
const mLabel = (m, short) => { if (!m) return ''; const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('en-IN', short ? { month: 'short' } : { month: 'long', year: 'numeric' }); };
const dLabel = d => { if (!d) return ''; if (d === today()) return 'Today'; if (d === addDays(today(), -1)) return 'Yesterday'; return new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: d.slice(0, 4) === String(new Date().getFullYear()) ? undefined : 'numeric' }); };
const h12 = h => { h = ((h % 24) + 24) % 24; return (h % 12 || 12) + (h >= 12 ? 'pm' : 'am'); };

const sum = a => r2(a.reduce((s, e) => s + (Number(e.amount) || 0), 0));
const uniq = a => [...new Set(a.filter(x => x !== '' && x != null))];
/* shift a yyyy-mm-dd by n months, clipping the day; a month-end stays a month-end */
const shiftD = (d, n) => { const y = +d.slice(0, 4), m = +d.slice(5, 7) - 1, dd = +d.slice(8, 10), t = new Date(y, m + n, 1), dim = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate(), wasEnd = dd === new Date(y, m + 1, 0).getDate(); return ymd(new Date(t.getFullYear(), t.getMonth(), wasEnd ? dim : Math.min(dd, dim))); };
const monday = d => { const x = new Date(d + 'T00:00:00'); return addDays(d, -((x.getDay() + 6) % 7)); };
const fyStart = d => { const y = +d.slice(0, 4), m = +d.slice(5, 7); return (m >= 4 ? y : y - 1) + '-04-01'; };
const fyLabel = d => { const y = +fyStart(d).slice(0, 4); return 'FY ' + y + '–' + String(y + 1).slice(2); };
const rLabel = (a, b) => { const o = { day: 'numeric', month: 'short' }, A = new Date(a + 'T00:00:00'), B = new Date(b + 'T00:00:00'); return A.toLocaleDateString('en-IN', Object.assign({}, o, a.slice(0, 4) !== b.slice(0, 4) ? { year: 'numeric' } : {})) + ' – ' + B.toLocaleDateString('en-IN', Object.assign({ year: 'numeric' }, o)); };
/* comparison windows: previous period of equal length (by months when the range is month-based) and same period last year */
function cmpRanges(r) {
  const end = r.to > today() ? today() : r.to;
  const prev = r.mo ? { from: shiftD(r.from, -r.mo), to: shiftD(end, -r.mo) } : (() => { const len = dayDiff(r.from, end) + 1; return { from: addDays(r.from, -len), to: addDays(r.from, -1) }; })();
  return { end, prev, ly: r.mo === 12 ? null : { from: shiftD(r.from, -12), to: shiftD(end, -12) } };
}
const pctCh = (a, b) => (b > 0 && a != null) ? Math.round((a - b) / b * 100) : null;
const tagsOf = s => (String(s || '').match(/#[\p{L}\p{N}_-]+/gu) || []).map(t => t.toLowerCase());
const parseAmt = v => { v = String(v == null ? '' : v).replace(/[,₹\s]/g, '').replace(/−/g, '-'); if (!/^[\d.+\-]+$/.test(v)) return NaN; let t = 0, ok = false; (v.match(/[+\-]?[\d.]+/g) || []).forEach(x => { const n = parseFloat(x); if (!isNaN(n)) { t += n; ok = true; } }); return ok ? r2(t) : NaN; };
const greet = () => { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; };
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) { } };
function toast(msg, action, fn) {
  const t = $('#toast'); t.innerHTML = '<span>' + esc(msg) + '</span>' + (action ? '<button id="tAct">' + esc(action) + '</button>' : '');

function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

/* ---------- defaults ---------- */
const CAT_DEF = [['Food', '🍽️', '#F97316'], ['Household', '🏠', '#EAB308'], ['Transportation', '🚕', '#14B8A6'], ['Personal & Lifestyle', '🛍️', '#A855F7'], ['Education', '📚', '#3B82F6'], ['Medical', '💊', '#EC4899'], ['Financial', '💳', '#64748B'], ['Miscellaneous', '✨', '#84CC16']];
const defCfg = () => ({ categories: CAT_DEF.map(([name, icon, color]) => ({ name, icon, color, budget: 0, hidden: false })), sources: ['Salary', 'Bonus', 'Interest', 'Refund', 'Gift', 'Other'], invTypes: ['Stocks', 'Mutual Fund', 'ETF', 'Gold', 'FD / RD / PPF'], report: { on: true, day: 1, hour: 9, email: '', weekly: false, wHour: 9, cmp: 'prev' }, matched: {}, nudges: { weekly: true, anomaly: true, pace: true, recon: 14, goals: true }, profile: { born: '', earning: '' }, payees: {}, holdings: {} });
const ACC_T = { bank: ['🏦', 'Bank'], cash: ['💵', 'Cash'], wallet: ['👛', 'Wallet / UPI'], card: ['💳', 'Credit card'], investment: ['📈', 'Investment'] };
const COLL = { Expenses: 'exp', Income: 'inc', Transfers: 'trf', Investments: 'inv', EMILog: 'emi', GoalLog: 'goal', LoanLog: 'loan', Adjustments: 'adj', Accounts: 'accounts', Goals: 'goals', EMIs: 'emis', Loans: 'loans', Reminders: 'rem', Pending: 'pend' };
const CFG_OBJ = ['report', 'matched', 'nudges', 'profile', 'payees', 'holdings'];
const APP_V = 6;
const POS = new Set(['Add', 'Opening', 'Merge In', 'Move In']);
const LUP = new Set(['Borrow', 'Lend', 'Opening']);
const LACC = { Borrow: 1, Receive: 1, Lend: -1, Repay: -1 };
const EMOJIS = ['🍽️', '🏠', '🚕', '🛍️', '📚', '💊', '💳', '✨', '☕', '🛒', '⛽', '🎬', '✈️', '🎁', '🐾', '👶', '💡', '📱', '🏋️', '💇', '🍺', '🧾', '🙏', '🎓', '🏷️'];
const GOAL_ICONS = ['🎯', '🛟', '🩺', '📺', '✈️', '🏍️', '💍', '🏡', '🎓', '📱', '🎁', '💻'];
const SWATCH = ['#5B5BF7', '#12A150', '#F59E0B', '#E5484D', '#0EA5E9', '#A855F7', '#EC4899', '#14B8A6', '#F97316', '#64748B'];
const EYE = '<svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24"><path d="M17.9 17.9A10.8 10.8 0 0 1 12 19C5 19 1 12 1 12a19.6 19.6 0 0 1 5.1-5.9M9.9 5.2A10 10 0 0 1 12 5c7 0 11 7 11 7a19.7 19.7 0 0 1-2.2 3.2M14.1 14.2a3 3 0 1 1-4.2-4.3M1 1l22 22"/></svg>';

/* ---------- state ---------- */
const KEY = 'ledger3';
let S = (() => {
  const b = { accounts: [], goals: [], emis: [], loans: [], exp: [], inc: [], trf: [], inv: [], emi: [], goal: [], loan: [], adj: [], rem: [], pend: [], cfg: null, outbox: [], url: '', key: '', prefs: {}, pin: '', autoLock: true, theme: '', lastSync: '', hide: false };
  try { return Object.assign(b, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { return b; }
})();
if (!S.cfg) S.cfg = defCfg();
['categories', 'sources', 'invTypes'].forEach(k => { if (!Array.isArray(S.cfg[k])) S.cfg[k] = defCfg()[k]; });
CFG_OBJ.forEach(k => { S.cfg[k] = Object.assign({}, defCfg()[k], S.cfg[k] && typeof S.cfg[k] === 'object' ? S.cfg[k] : {}); });
if (!S.prefs || typeof S.prefs !== 'object') S.prefs = {};
['loans', 'loan', 'rem', 'pend'].forEach(k => { if (!Array.isArray(S[k])) S[k] = []; });
S.outbox = S.outbox.filter(o => o.op !== 'addCategory');
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Phone storage is full. Export a backup.'); } };
const U = { tab: 'home', month: ym(), q: '', cat: 'all', mseg: 'inc', c: null, charts: [], after: null, extra: false, fresh: true, f: { range: 'month', from: '', to: '', accs: [], cats: [], min: '', q: '' } };
let C = { bal: {}, saved: {}, held: {}, lout: {}, gIn: {} };

/* ---------- local apply / commit ---------- */
function localApply(o) {
  if (o.op === 'config') { S.cfg[o.key] = o.value; return; }
  if (o.op === 'renameAccount') {
    const f = o.from, t = o.to;
    ['exp', 'inc', 'emi', 'goal', 'loan', 'adj'].forEach(k => S[k].forEach(e => { if (e.account === f) e.account = t; }));
    ['trf', 'inv'].forEach(k => S[k].forEach(e => { if (e.from === f) e.from = t; if (e.to === f) e.to = t; }));
    S.goals.forEach(g => { if (g.account === f) g.account = t; });
    S.emis.forEach(m => { if (m.account === f) m.account = t; });
    S.accounts.forEach(a => { if (a.keptIn === f) a.keptIn = t; });
    Object.keys(S.prefs).forEach(k => { if (S.prefs[k] === f) S.prefs[k] = t; });
    U.f.accs = U.f.accs.map(x => x === f ? t : x);
    S.rem.forEach(r => { if (r.account === f) r.account = t; if (r.invTo === f) r.invTo = t; });
    if (S.cfg.matched && S.cfg.matched[f]) { S.cfg.matched[t] = S.cfg.matched[f]; delete S.cfg.matched[f]; }
    return;
  }
  if (o.op === 'renameCategory') { S.exp.forEach(e => { if (e.category === o.from) e.category = o.to; }); S.rem.forEach(r => { if (r.category === o.from) r.category = o.to; }); Object.values(S.cfg.payees || {}).forEach(p => { if (p.category === o.from) p.category = o.to; }); if (S.prefs.lastCat === o.from) S.prefs.lastCat = o.to; return; }

function commit(ops) { ops.forEach(o => { o = JSON.parse(JSON.stringify(o)); localApply(o); S.outbox.push(o); }); save(); C = calc(); flush(); setStatus(); }
const up = (sheet, row) => ({ op: 'upsert', sheet, row });
const del = (sheet, id) => ({ op: 'delete', sheet, id });
const cfgOp = (key, value) => ({ op: 'config', key, value });

/* ---------- balances (until = exclusive end timestamp, optional) ---------- */
function calc(until) {
  const bal = {}, start = {}, saved = {}, held = {}, lout = {};
  S.accounts.forEach(a => { bal[a.name] = r2(a.opening); start[a.name] = a.openingDate || ''; });
  const f = (acc, amt, ts) => { if (acc && acc in bal && ts >= start[acc] && (!until || ts < until)) bal[acc] = r2(bal[acc] + amt); };
  S.exp.forEach(e => f(e.account, -e.amount, e.ts));
  S.inc.forEach(e => f(e.account, e.amount, e.ts));
  S.trf.forEach(e => { f(e.from, -e.amount, e.ts); f(e.to, e.amount, e.ts); });
  S.inv.forEach(e => { f(e.from, -e.amount, e.ts); if (e.to) f(e.to, e.amount, e.ts); });
  S.emi.forEach(e => f(e.account, -e.amount, e.ts));

    if (!(e.goalId in saved) || (until && e.ts >= until)) return;

  });
  return { bal, saved, held, lout, gIn };
}
/* accounts marked "Held for others" (e.g. Mom's money kept in Kotak) never count as yours */
const isOthers = n => !!(acc(n) || {}).others;
const mineA = a => !a.others;
const pockets = n => S.accounts.filter(a => a.others && a.keptIn === n);
const acc = n => S.accounts.find(a => a.name === n);

  download('ledger_' + today() + '.csv', '﻿' + [['Log', 'Timestamp', 'Amount', 'Account / From', 'To', 'Category / Source / Type', 'Name / Goal / EMI / Person', 'Remarks', 'Photo']].concat(rows).map(x => x.map(q).join(',')).join('\n'), 'text/csv');
};

/* ---------- categories ---------- */
ACT.catNew = () => catSheet(-1);
ACT.catEdit = el => catSheet(+el.dataset.i);
function catSheet(i) {
  const c = i >= 0 ? S.cfg.categories[i] : { name: '', icon: '🏷️', color: SWATCH[S.cfg.categories.length % SWATCH.length], budget: 0, hidden: false };
  U.k = { i, icon: c.icon, color: c.color };
  openSheet(i >= 0 ? 'Edit category' : 'New category', `<div class="lbl">Name</div><input id="kName" value="${esc(c.name)}" placeholder="e.g. Pets">
  <div class="lbl">Icon</div><div class="chips wrap">${uniq([c.icon].concat(EMOJIS)).map(e => `<button class="chip emo ${e === c.icon ? 'on' : ''}" data-act="pick" data-o="k" data-f="icon" data-v="${e}">${e}</button>`).join('')}</div>
  <div class="lbl">Colour</div><div class="chips wrap">${uniq([c.color].concat(SWATCH, CAT_DEF.map(x => x[2]))).map(x => `<button class="chip sw ${x === c.color ? 'on' : ''}" data-act="pick" data-o="k" data-f="color" data-v="${x}" style="background:${x}"></button>`).join('')}</div>
  <div class="lbl">Monthly budget ₹</div><input id="kBud" inputmode="decimal" value="${c.budget || ''}" placeholder="No limit">
  ${i >= 0 ? `<label class="check"><input type="checkbox" id="kHide" ${c.hidden ? 'checked' : ''}> Hide from the picker (old entries stay)</label><div class="hint">Renaming also renames every old entry in the app and the Sheet.</div>` : '<div class="hint">Available immediately. It shows up in the Category column of your Sheet.</div>'}
  <button class="btn big" data-act="kSave">Save</button>`, 'tall');
}
ACT.kSave = () => {
  const K = U.k, n = $('#kName').value.trim(); if (!n) return toast('Name required');
  const list = JSON.parse(JSON.stringify(S.cfg.categories));
  if (list.some((c, j) => j !== K.i && c.name.toLowerCase() === n.toLowerCase())) return toast('That category already exists');
  const b = parseAmt($('#kBud').value), c = { name: n, icon: K.icon, color: K.color, budget: isNaN(b) ? 0 : b, hidden: !!($('#kHide') && $('#kHide').checked) };
  const ops = [];
  if (K.i >= 0) { const old = list[K.i].name; if (old !== n) ops.push({ op: 'renameCategory', from: old, to: n }); list[K.i] = c; }
  else list.push(c);
  ops.push(cfgOp('categories', list)); commit(ops); shut(); render(); toast('Saved');
};
ACT.catMove = el => { const i = +el.dataset.i, j = i + +el.dataset.d, a = S.cfg.categories.slice(); if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; commit([cfgOp('categories', a)]); render(); };

/* ---------- PIN lock ---------- */
const hashPin = s => { let h = 2166136261 >>> 0; for (let k = 0; k < 400; k++) for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h.toString(16); };
function showLock(mode) { U.pin = { mode, val: '', first: '' }; $('#lock').hidden = false; drawLock(); }
function drawLock() {
  const P = U.pin, title = { unlock: 'Enter your PIN', set1: 'Choose a 4-digit PIN', set2: 'Type it again' }[P.mode];
  $('#lock').innerHTML = `<div class="lk"><div class="logo">₹</div><h2>${title}</h2><div class="dots" id="dots">${[0, 1, 2, 3].map(i => `<i class="${i < P.val.length ? 'on' : ''}"></i>`).join('')}</div><div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, 'x', 0, '⌫'].map(k => k === 'x' ? (P.mode === 'unlock' ? '<span></span>' : '<button class="pk t" data-act="pinCancel">Cancel</button>') : `<button class="pk ${k === '⌫' ? 't' : ''}" data-act="pinKey" data-k="${k}">${k}</button>`).join('')}</div>${P.mode === 'unlock' ? '<button class="forgot" data-act="pinForgot">Forgot PIN?</button>' : ''}</div>`;
}
ACT.pinKey = el => {
  const P = U.pin, k = el.dataset.k; buzz(5);
  if (k === '⌫') { P.val = P.val.slice(0, -1); return drawLock(); }
  if (P.val.length >= 4) return; P.val += k; drawLock(); if (P.val.length < 4) return;
  setTimeout(() => {
    if (P.mode === 'unlock') {
      if (hashPin(P.val + '|ledger') === S.pin) { $('#lock').hidden = true; if (S.url && S.key && Date.now() - lastPull > 60000) pull(true); }
      else { buzz([30, 40, 30]); $('#dots').classList.add('shake'); P.val = ''; setTimeout(drawLock, 380); }
    } else if (P.mode === 'set1') { U.pin = { mode: 'set2', val: '', first: P.val }; drawLock(); }
    else if (P.val === P.first) { S.pin = hashPin(P.val + '|ledger'); save(); $('#lock').hidden = true; toast('PIN set 🔒'); render(); }
    else { toast("PINs didn't match. Try again."); U.pin = { mode: 'set1', val: '', first: '' }; drawLock(); }
  }, 140);
};
ACT.pinCancel = () => { $('#lock').hidden = true; };
document.addEventListener('keydown', e => {
  if ($('#lock').hidden || !U.pin) return;
  const k = /^[0-9]$/.test(e.key) ? e.key : e.key === 'Backspace' ? '⌫' : null;
  if (k) { e.preventDefault(); ACT.pinKey({ dataset: { k } }); }
  else if (e.key === 'Escape' && U.pin.mode !== 'unlock') ACT.pinCancel();
});
ACT.pinSet = () => showLock('set1');
ACT.pinOff = () => { if (!confirm('Remove PIN lock?')) return; S.pin = ''; save(); render(); };
ACT.pinForgot = () => {
  if (S.key) {
    const k = prompt('Type your Sheet secret key to reset the PIN.\n(Apps Script → Ledger menu → Show secret key)');
    if (k === null) return;
    if (k.trim() === S.key) { S.pin = ''; save(); $('#lock').hidden = true; render(); toast('PIN removed. Set a new one in Settings.'); }
    else toast('That key does not match');
    return;
  }
  if (!confirm('No Sheet is connected, so the only way in is to reset the app on this phone. Continue?')) return;
  localStorage.removeItem(KEY); location.reload();
};

/* ---------- theme & install icon ---------- */
function applyTheme() {
  const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('#themeColor').setAttribute('content', dark ? '#0B0D14' : '#F6F7FB');
}
function setupIcons() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 512, 512); g.addColorStop(0, '#9D7BFF'); g.addColorStop(1, '#4F4FE8');
    x.fillStyle = g; x.fillRect(0, 0, 512, 512); x.fillStyle = '#fff'; x.font = 'bold 300px system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('₹', 256, 272);
    const url = c.toDataURL('image/png'); $('#appleIcon').href = url; $('#favIcon').href = url;
    const m = { name: 'Ledger', short_name: 'Ledger', start_url: location.href.split('#')[0], display: 'standalone', background_color: '#F6F7FB', theme_color: '#5B5BF7', icons: [{ src: url, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }] };
    $('#manifest').href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
  } catch (e) { }
}

/* ---------- boot ---------- */
applyTheme(); setupIcons();
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!S.theme) { applyTheme(); render(); } }); } catch (e) { }
setTab('home');
if (S.pin) showLock('unlock');
if (S.url && S.key) flush().then(() => pull(true)).then(() => { if (runAuto()) render(); });
else if (!S.accounts.length) setTimeout(welcome, 450);
else if (runAuto()) render();
setInterval(flush, 30000);
window.addEventListener('online', flush);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { U.hiddenAt = Date.now(); flush(); return; }
  if (S.pin && S.autoLock && U.hiddenAt && Date.now() - U.hiddenAt > 60000) showLock('unlock');
  else if (S.url && S.key && !S.outbox.length && Date.now() - lastPull > 60000) pull(true);
});
</script>
</body>
</html>
