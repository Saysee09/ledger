name: Build Brokeless Android app

on:
  push:
    branches: [main, dev]
    paths: ['android/**', 'index.html', 'RELEASE_NOTES.md', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signing key
        env:
          KS: ${{ secrets.LEDGER_KEYSTORE }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Add the LEDGER_KEYSTORE secret first (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$KS" | base64 -d > android/app/ledger.jks

      - name: Put the app screens inside the APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html android/app/src/main/assets/www/index.html

      - name: Build
        working-directory: android
        run: gradle assembleDirectRelease bundlePlayRelease --no-daemon --stacktrace -PversionCode=${{ github.run_number }} -PversionSuffix=${{ github.ref_name != 'main' && '-test' || '' }}

      - name: Name the file
        run: |
          cp android/app/build/outputs/apk/direct/release/app-direct-release.apk ledger.apk
          cp android/app/build/outputs/bundle/playRelease/app-play-release.aab brokeless-play-${{ github.run_number }}.aab

      # The Google Play bundle (.aab). Not attached to the Release, so the in-app updater never sees it.
      - name: Keep the Google Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: brokeless-play-${{ github.run_number }}
          path: brokeless-play-${{ github.run_number }}.aab
          retention-days: 90

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'android' || 'test' }}-${{ github.run_number }}
          name: ${{ github.ref_name == 'main' && 'Brokeless Android' || 'TEST build (dev branch)' }} ${{ github.run_number }}
          body_path: RELEASE_NOTES.md
          files: ledger.apk
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' }}
