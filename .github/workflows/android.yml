name: Build Ledger Android app

on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Signing key
        env:
          KS: ${{ secrets.LEDGER_KEYSTORE }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Add the LEDGER_KEYSTORE secret first (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$KS" | base64 -d > android/app/ledger.jks

      - name: Put the app screens inside the APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html android/app/src/main/assets/www/index.html

      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace -PversionCode=${{ github.run_number }}

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk ledger.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Ledger Android ${{ github.run_number }}
          body: Install ledger.apk on your phone. Newer versions install over the old one and keep your data.
          files: ledger.apk
          make_latest: true
