plugins {
    id 'com.android.application'
}

def vc = Integer.parseInt((project.findProperty('versionCode') ?: '1').toString())

android {
    namespace 'com.saysee.ledger'
    compileSdk 36

    defaultConfig {
        applicationId 'com.saysee.ledger'
        minSdk 26
        targetSdk 36
        versionCode vc
        versionName "8.0." + vc + (project.findProperty('versionSuffix') ?: '')
    }

    buildFeatures {
        buildConfig true
    }

    // direct = the APK shared by link (updates itself from GitHub). play = the Google Play build:
    // its own app ID, no self-updater and no "install apps" permission, because Play does the updating.
    flavorDimensions 'dist'
    productFlavors {
        direct {
            dimension 'dist'
            buildConfigField 'boolean', 'PLAY', 'false'
        }
        play {
            dimension 'dist'
            applicationId((project.findProperty('playAppId') ?: 'com.brokeless.app').toString())
            buildConfigField 'boolean', 'PLAY', 'true'
        }
    }

    signingConfigs {
        release {
            storeFile file('ledger.jks')
            storePassword System.getenv('KS_PASS') ?: 'ledgerapp'
            keyAlias 'ledger'
            keyPassword System.getenv('KS_PASS') ?: 'ledgerapp'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
